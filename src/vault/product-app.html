<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¡Cumple de {{NAME}}! 🎉</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0b0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 40px;
      overflow-x: hidden;
    }

    /* Fondo festivo sutil */
    .confetti-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, rgba(239, 68, 68, 0.15) 0%, rgba(11, 11, 15, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Tarjeta Scrolleable */
    .card-container {
      width: 100%;
      max-width: 420px;
      background: #14141a;
      border: 1px solid #282833;
      border-radius: 28px;
      padding: 32px 20px;
      text-align: center;
      position: relative;
      z-index: 10;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    /* Botón flotante de música */
    .music-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ef4444;
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      font-size: 20px;
      animation: pulseMusic 2s infinite ease-in-out;
    }

    @keyframes pulseMusic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Foto del Cumpleañero/a */
    .photo-wrapper {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
    }

    .photo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #222;
      display: block;
    }

    .badge-age {
      display: inline-block;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .invite-text {
      font-size: 16px;
      color: #d1d5db;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Bloque de Día y Hora */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .info-card {
      background: #1c1c24;
      border: 1px solid #2e2e3a;
      border-radius: 16px;
      padding: 14px 10px;
    }

    .info-card span {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .info-card strong {
      font-size: 15px;
      color: #ffffff;
    }

    /* Bloque de Ubicación y Mapa */
    .location-box {
      background: #1c1c24;
      border: 1px solid #2e2e3a;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .location-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
      color: #ef4444;
    }

    .location-address {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .location-city {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    /* Mapa Gráfico a Escala de 3 Manzanas (Vectorial / Modo Roadmap) */
    .map-frame {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      border: 1px solid #333344;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .map-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      filter: contrast(1.05);
    }

    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-maps:hover {
      background: #1d4ed8;
    }

    /* Botón Compartir WhatsApp */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #25d366;
      color: #ffffff;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }

    .btn-whatsapp:active {
      transform: scale(0.98);
    }

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="confetti-bg"></div>

  <!-- Reproductor de Música -->
  <button id="musicToggle" class="music-btn" onclick="toggleMusic()">🎵</button>
  <audio id="bgAudio" loop preload="auto">
    <source src="/audio/celebration.mp3" type="audio/mpeg">
    <source src="/audio/celebration.wav" type="audio/wav">
  </audio>

  <main class="card-container">
    
    <!-- Foto del Cumpleañero/a -->
    <div class="photo-wrapper">
      <img id="cardPhoto" src="{{PHOTO}}" alt="{{NAME}}" class="photo-img" onerror="this.src='data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%23ef4444\'/><text x=\'50\' y=\'65\' font-size=\'40\' text-anchor=\'middle\' fill=\'white\'>🎉</text></svg>'">
    </div>

    <div class="badge-age">¡Cumple {{AGE}} Años!</div>
    <h1>{{NAME}}</h1>
    <p class="invite-text">¡Te invito a festejar mi cumpleaños juntos! 🎂🎈</p>

    <!-- Información de Fecha y Hora -->
    <div class="info-grid">
      <div class="info-card">
        <span>📅 Día</span>
        <strong>{{DATE}}</strong>
      </div>
      <div class="info-card">
        <span>⏰ Hora</span>
        <strong>{{TIME}}</strong>
      </div>
    </div>

    <!-- Ubicación y Mapa a escala de 3 manzanas -->
    <div class="location-box">
      <div class="location-header">
        <span>📍 ¿Dónde es?</span>
      </div>
      <div class="location-address">{{ADDRESS}}</div>
      <div class="location-city">{{CITY}}</div>

      <!-- Mapa Gráfico Roadmap (Escala 3 manzanas con OpenStreetMap) -->
      <div class="map-frame">
        <iframe id="mapFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=-58.385%2C-34.606%2C-58.378%2C-34.600&layer=mapnik&marker=-34.603%2C-58.3815"></iframe>
      </div>

      <a id="googleMapsBtn" href="https://www.google.com/maps/search/?api=1&query={{ADDRESS}},%20{{CITY}}" target="_blank" class="btn-maps">
        🗺️ Ver en Google Maps / GPS
      </a>
    </div>

    <!-- Botón para Compartir Invitación por WhatsApp -->
    <button class="btn-whatsapp" onclick="shareInvitation()">
      📲 Compartir Invitación por WhatsApp
    </button>

    <footer>
      Tarjeta Oficial Verificada • Licencia ORD-{{ORDER_ID}} • pi.juguetes
    </footer>
  </main>

  <script>
    const audio = document.getElementById('bgAudio');
    const musicBtn = document.getElementById('musicToggle');
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        musicBtn.innerText = '🔇';
        isPlaying = false;
      } else {
        audio.play().then(() => {
          musicBtn.innerText = '🎵';
          isPlaying = true;
        }).catch(() => {
          musicBtn.innerText = '▶️';
        });
      }
    }

    // Auto-reproducir con interacción del usuario
    window.addEventListener('click', () => {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          musicBtn.innerText = '🎵';
        }).catch(() => {});
      }
    }, { once: true });

    // Geocodificación dinámica para el mapa
    const address = "{{ADDRESS}}";
    const city = "{{CITY}}";
    if (address && city) {
      const query = encodeURIComponent(address + ', ' + city);
      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}`)
        .then(r => r.json())
        .then(data => {
          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lon = parseFloat(data[0].lon);
            // Delta de 0.003 grados equivale a ~3 manzanas (~300 metros)
            const delta = 0.0025;
            const bbox = `${lon - delta}%2C${lat - delta}%2C${lon + delta}%2C${lat + delta}`;
            document.getElementById('mapFrame').src = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}`;
          }
        })
        .catch(() => {});
    }

    function shareInvitation() {
      const text = encodeURIComponent(`¡Hola! Te invito al cumpleaños de {{NAME}} ({{AGE}} años) 🎉\n📅 Día: {{DATE}} a las {{TIME}}\n📍 Lugar: {{ADDRESS}}, {{CITY}}\n\nVer tarjeta completa interactiva:\n${window.location.href}`);
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }
  </script>
</body>
</html>
