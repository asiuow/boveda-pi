<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cuadrado 2D | pi.juguetes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Cuadrado 2D Flat Minimalista */
    .square-2d {
      width: 120px;
      height: 120px;
      background-color: #ff0000;
      animation: rotate2D 3s linear infinite;
    }

    @keyframes rotate2D {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Etiqueta mínima inferior */
    .info {
      position: fixed;
      bottom: 24px;
      font-size: 11px;
      color: #555555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="square-2d"></div>

  <div class="info">
    pi.juguetes • Pago Verificado
  </div>

</body>
</html>
