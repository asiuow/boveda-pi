<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cuadrado 2D | pi.juguetes</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ff0000'/></svg>">
</head>
<body>

  <main class="container">
    <div class="card">
      
      <!-- Cuadrado 2D Flat Girando -->
      <div class="preview-container">
        <div class="square-2d-preview"></div>
      </div>

      <h1>Cuadrado 2D Giratorio</h1>
      <p class="subtitle">pi.juguetes</p>

      <div class="price-tag">
        <span>Precio oficial</span>
        <strong>$10 ARS</strong>
      </div>

      <!-- Botones de Acción -->
      <div class="btn-group">
        <button id="btnPay" class="btn btn-pay" onclick="handleStartPayment()">
          Pagar $10 con Mercado Pago
        </button>

        <button id="btnWhatsapp" class="btn btn-whatsapp" onclick="handleShareWhatsApp()">
          Compartir en WhatsApp
        </button>

        <button id="btnCopy" class="btn btn-copy" onclick="handleCopyLink()">
          Copiar enlace
        </button>
      </div>

      <!-- Panel de Estado / Enlace Web Desbloqueado (Sin Descarga) -->
      <div id="statusPanel" class="status-panel">
        <div id="statusSpinner" class="status-spinner"></div>
        <div id="statusText" class="status-text">Esperando confirmación del pago...</div>

        <!-- Grupo de Enlace Generado -->
        <div id="unlockedGroup" style="display: none; flex-direction: column; gap: 10px; margin-top: 10px;">
          <a id="btnOpenWeb" href="#" target="_blank" class="btn btn-pay">
            Abrir Animación Web
          </a>
          <button id="btnShareUnlocked" class="btn btn-whatsapp" onclick="handleShareUnlockedLink()">
            Compartir enlace web en WhatsApp
          </button>
        </div>
      </div>

      <!-- Botón de Simulación de Pago Aprobado -->
      <div>
        <button class="btn-sim" onclick="handleSimulateApproved()">
          ⚡ Simular pago aprobado
        </button>
      </div>

    </div>
  </main>

  <div id="toast" class="toast">Enlace copiado</div>

  <script src="/js/app.js"></script>
</body>
</html>
